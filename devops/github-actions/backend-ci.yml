name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: medical_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U testuser -d medical_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://testuser:testpass@localhost:5432/medical_test
      OPENAI_API_KEY: test-openai-key
      SECRET_KEY: test-secret-key
      CORS_ORIGINS: http://localhost:3000
      ENVIRONMENT: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if ! command -v pytest >/dev/null 2>&1; then pip install pytest; fi

      - name: Run ruff if configured
        run: |
          if command -v ruff >/dev/null 2>&1; then
            ruff check .
          else
            echo "ruff is not installed; skipping lint"
          fi

      - name: Run pytest
        run: |
          if [ -d tests ]; then
            pytest -q
          else
            echo "No backend/tests directory found; skipping pytest for initial seminar template"
          fi
