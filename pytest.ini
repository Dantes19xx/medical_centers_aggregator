[pytest]
# Run from project root:  pytest backend/tests/ -v --cov=backend/app
# Run from backend/:      pytest tests/ -v --cov=app
asyncio_mode = auto
testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
markers =
    unit: isolated unit tests (no DB, no network)
    integration: tests that hit the test database
    e2e: Playwright end-to-end tests
